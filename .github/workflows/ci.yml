name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, build, test (SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build the live front end (not the UI preview)
        run: npm run build
        env:
          VITE_UI_PREVIEW: "0"
      - name: Tests with coverage (SQLite)
        run: npm run coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total;const f=k=>s[k].pct+'% ('+s[k].covered+'/'+s[k].total+')';console.log('## Server test coverage\n\n| Statements | Branches | Functions | Lines |\n|---|---|---|---|\n| '+['statements','branches','functions','lines'].map(f).join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

  postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Whole suite on PostgreSQL (each test file gets its own database)
        run: npm test
        env:
          TEST_PG_URL: postgres://postgres:pw@localhost:5432/postgres
          DATABASE_POOL: "3"
          DATABASE_IDLE_MS: "500"

  stack:
    name: Full stack (app + PostgreSQL + bucket), OCR and tutor smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the image and start the stack (waits for the app's health check)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test against the running stack
        run: node scripts/smoke.mjs --url http://localhost:3001
      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
