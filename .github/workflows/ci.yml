name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, build, test (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build the live front end (not the UI preview)
        run: npm run build
        env:
          VITE_UI_PREVIEW: "0"
      - run: npm test

  postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Whole suite on PostgreSQL (each test file gets its own database)
        run: npm test
        env:
          TEST_PG_URL: postgres://postgres:pw@localhost:5432/postgres
          DATABASE_POOL: "3"
          DATABASE_IDLE_MS: "500"

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t kavli:ci .
      - name: Start it and check health
        run: |
          docker run -d --name kavli -p 3001:3001 -e NODE_ENV=production -e SEED_DEMO=0 -e DATABASE_PATH=/tmp/ci.db kavli:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs kavli
          exit 1
