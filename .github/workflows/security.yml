name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, new advisories appear without code changes

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (production dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Fail on moderate or higher
        run: npm audit --omit=dev --audit-level=moderate
