# Local stack that looks like production: the app, PostgreSQL, and an S3-compatible bucket.
#   docker compose up --build            then open http://localhost:3001
#   node scripts/smoke.mjs               end-to-end check against it (admin: admin@demo.kavli.local / demo@12345)
# Demo accounts are ON here so you can sign in at once. For a real deployment use docs/DEPLOYMENT.md (SEED_DEMO=0, your own secrets).
# Add ANTHROPIC_API_KEY, AZURE_SPEECH_KEY/REGION, RESEND_API_KEY etc. in a `.env` file next to this one to try the real services.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: kavli, POSTGRES_PASSWORD: kavli, POSTGRES_DB: kavli }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kavli"], interval: 3s, timeout: 3s, retries: 20 }

  s3:
    # An S3-compatible bucket for local use (Adobe S3Mock). In production use AWS S3, Cloudflare R2 or similar (docs/DEPLOYMENT.md).
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: kavli-books
      initialBuckets: kavli-books
      retainFilesOnExit: "true"
    volumes: [s3data:/s3mockroot]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
    env_file: [{ path: .env, required: false }]
    environment:
      NODE_ENV: development          # plain http on localhost: cookies are not marked secure
      PORT: "3001"
      PUBLIC_URL: http://localhost:3001
      SEED_DEMO: "1"
      BOOK_ONLY: "1"                 # show only uploaded textbooks — no built-in sample lessons, tests or practice questions
      DATABASE_URL: postgres://kavli:kavli@db:5432/kavli
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:9090
      S3_BUCKET: kavli-books
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
    ports: ["3001:3001"]

volumes: { dbdata: {}, s3data: {} }
